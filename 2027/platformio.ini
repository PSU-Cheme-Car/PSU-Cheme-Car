; PlatformIO Project Configuration File
;
; EDIT [env:...] and "board" below to match your actual board.
; Common options:
;   Arduino Uno       -> board = uno
;   Arduino Nano      -> board = nanoatmega328
;   Arduino Mega 2560  -> board = megaatmega2560
;   ESP32 dev board   -> platform = espressif32, board = esp32dev
;
; If you're driving 12 servos, an Uno/Nano (14 digital pins) is tight
; but workable; a Mega or an ESP32 gives you more headroom and more
; stable timing if you add sensors later.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@^1.2.1
